name: 测试

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python、JavaScript 与脚本检查
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 获取当前提交
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          git init .
          git remote add origin "$REPOSITORY_URL"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: 显示运行环境
        run: |
          python3 --version
          node --version
          npm --version

      - name: 运行 Python 测试
        run: python3 -W error::ResourceWarning -m unittest discover -s tests/python -v

      - name: 检查 Python 语法
        run: python3 -m compileall -q vps/subflow tests/python

      - name: 检查跨运行时生成常量
        run: |
          python3 scripts/gen_config.py --check
          python3 scripts/gen_dependencies.py --check

      - name: 检查 Markdown 本地链接
        run: python3 scripts/check_markdown_links.py

      - name: 运行 JavaScript 测试
        run: npm test

      - name: 运行配置生成冒烟测试
        run: npm run smoke

      - name: 检查 Shell 语法
        run: |
          find vps scripts -type f -name '*.sh' -print0 \
            | xargs -0 -n1 bash -n

      - name: 检查补丁空白
        run: git diff --check