name: Deploy central Cloudflare platform

on:
  workflow_dispatch:
    inputs:
      initialize:
        description: Create missing D1 and Direct Upload Pages resources on first deployment
        type: boolean
        default: false
      confirm_production:
        description: Confirm production deployment and forward-only database migrations
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: subflow-central-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Deploy database, central Worker and Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUBFLOW_ADMIN_TOKEN: ${{ secrets.SUBFLOW_ADMIN_TOKEN }}
          SUBFLOW_CREDENTIAL_KEY: ${{ secrets.SUBFLOW_CREDENTIAL_KEY }}
          SUBFLOW_D1_DATABASE_ID: ${{ vars.SUBFLOW_D1_DATABASE_ID }}
          SUBFLOW_PAGES_PROJECT: ${{ vars.SUBFLOW_PAGES_PROJECT }}
          SUBFLOW_WORKER_NAME: ${{ vars.SUBFLOW_WORKER_NAME }}
          INITIALIZE: ${{ inputs.initialize }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ "$INITIALIZE" = true ]; then
            npm run deploy:central -- --initialize
          else
            npm run deploy:central
          fi
