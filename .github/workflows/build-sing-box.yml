name: 构建含 V2Ray API 的 sing-box

on:
  workflow_dispatch:
  schedule:
    # 每天 03:20 UTC，配合 should_build 比对，无新版自动跳过
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  check-build-release:
    runs-on: ubuntu-latest

    steps:
      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl tar gzip

      - name: 获取上游最新版本
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest_tag=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r .tag_name)
          [[ "$latest_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]] || {
            echo "无法识别上游版本：$latest_tag" >&2
            exit 1
          }
          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "version=${latest_tag#v}" >> "$GITHUB_OUTPUT"

      - name: 判断当前上游版本是否完整发布
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.latest.outputs.tag }}"
          version="${{ steps.latest.outputs.version }}"
          if release_json=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${tag}" \
            2>/dev/null); then
            required_assets=(
              sing-box-linux-amd64
              sing-box-linux-arm64
              sing-box-linux-amd64.tar.gz
              sing-box-linux-arm64.tar.gz
              "sing-box-source-${version}.tar.gz"
              sing-box-LICENSE
              BUILD_INFO.json
              RELEASE_NOTES.md
              sha256sum.txt
            )
            missing_assets=()
            for asset in "${required_assets[@]}"; do
              if ! jq -e --arg asset "$asset" '[.assets[].name] | index($asset) != null' <<<"$release_json" >/dev/null; then
                missing_assets+=("$asset")
              fi
            done
            if (( ${#missing_assets[@]} == 0 )); then
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              echo "当前版本已完整发布：$tag"
            else
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              printf '当前 Release 缺少必要资产，将重建：%s\n' "${missing_assets[*]}"
            fi
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "需要构建：$tag"
          fi

      - name: 显示跳过原因
        if: steps.current.outputs.should_build != 'true'
        run: |
          echo "仓库已发布上游版本：${{ steps.latest.outputs.tag }}"

      - name: 检出 sing-box 官方源码
        if: steps.current.outputs.should_build == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: SagerNet/sing-box
          ref: ${{ steps.latest.outputs.tag }}
          path: sing-box-src
          fetch-depth: 0

      - name: 配置 Go
        if: steps.current.outputs.should_build == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: sing-box-src/go.mod
          cache: true
          cache-dependency-path: sing-box-src/go.sum

      - name: 准备构建标签与链接参数
        if: steps.current.outputs.should_build == 'true'
        id: meta
        run: |
          cd sing-box-src

          default_tags=$(tr '\n' ',' < release/DEFAULT_BUILD_TAGS | sed 's/,$//')

          # NaiveProxy 的 Linux purego 构建还需要随包提供 libcronet.so；本项目不提供该库，
          # 因此删除对应标签，避免发布一个显示支持但运行时缺少组件的功能。
          final_tags=$(printf '%s\n' "$default_tags" | tr ',' '\n' \
            | jq -Rr 'select(length > 0) | select(. != "with_naive_outbound")' \
            | awk '!seen[$0]++' | paste -sd',' -)

          # 上游 Linux 默认标签已包含 with_acme 与 with_wireguard；仅追加流量统计所需标签。
          final_tags="${final_tags},with_v2ray_api"

          # 原项目 ldflags
          base_ldflags=$(tr '\n' ' ' < release/LDFLAGS | sed 's/  */ /g')

          # 显式写入版本号，避免 sing-box version 显示 unknown
          final_ldflags="-X 'github.com/sagernet/sing-box/constant.Version=${{ steps.latest.outputs.version }}' ${base_ldflags}"

          echo "tags=$final_tags" >> "$GITHUB_OUTPUT"
          echo "ldflags=$final_ldflags" >> "$GITHUB_OUTPUT"

          echo "构建标签：$final_tags"
          echo "链接参数：$final_ldflags"

      - name: 构建 Linux amd64
        if: steps.current.outputs.should_build == 'true'
        run: |
          cd sing-box-src
          mkdir -p ../dist/linux-amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -trimpath \
            -ldflags "${{ steps.meta.outputs.ldflags }}" \
            -tags "${{ steps.meta.outputs.tags }}" \
            -o ../dist/linux-amd64/sing-box \
            ./cmd/sing-box

      - name: 构建 Linux arm64
        if: steps.current.outputs.should_build == 'true'
        run: |
          cd sing-box-src
          mkdir -p ../dist/linux-arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
          go build -trimpath \
            -ldflags "${{ steps.meta.outputs.ldflags }}" \
            -tags "${{ steps.meta.outputs.tags }}" \
            -o ../dist/linux-arm64/sing-box \
            ./cmd/sing-box

      - name: 验证版本与必要构建标签
        if: steps.current.outputs.should_build == 'true'
        run: |
          chmod +x dist/linux-amd64/sing-box
          dist/linux-amd64/sing-box version
          dist/linux-amd64/sing-box version | grep "${{ steps.latest.outputs.version }}"
          dist/linux-amd64/sing-box version | grep with_v2ray_api
          dist/linux-amd64/sing-box version | grep with_wireguard
          dist/linux-amd64/sing-box version | grep with_acme
          go version -m dist/linux-amd64/sing-box | grep 'CGO_ENABLED=0'
          go version -m dist/linux-arm64/sing-box | grep 'CGO_ENABLED=0'

      - name: 验证二进制存在
        if: steps.current.outputs.should_build == 'true'
        run: |
          test -f dist/linux-amd64/sing-box
          test -f dist/linux-arm64/sing-box

      - name: 打包二进制、对应源码与许可证
        if: steps.current.outputs.should_build == 'true'
        run: |
          mkdir -p release-files
          tar -C dist/linux-amd64 -czf release-files/sing-box-linux-amd64.tar.gz sing-box
          tar -C dist/linux-arm64 -czf release-files/sing-box-linux-arm64.tar.gz sing-box

          cp dist/linux-amd64/sing-box release-files/sing-box-linux-amd64
          cp dist/linux-arm64/sing-box release-files/sing-box-linux-arm64
          cp sing-box-src/LICENSE release-files/sing-box-LICENSE

          upstream_commit=$(git -C sing-box-src rev-parse HEAD)
          version="${{ steps.latest.outputs.version }}"
          git -C sing-box-src archive \
            --format=tar.gz \
            --prefix="sing-box-source-${version}/" \
            --output="../release-files/sing-box-source-${version}.tar.gz" \
            HEAD

          jq -n \
            --arg upstream_repository "https://github.com/SagerNet/sing-box" \
            --arg upstream_tag "${{ steps.latest.outputs.tag }}" \
            --arg upstream_commit "$upstream_commit" \
            --arg go_version "$(go env GOVERSION)" \
            --arg build_tags "${{ steps.meta.outputs.tags }}" \
            --arg ldflags "${{ steps.meta.outputs.ldflags }}" \
            '{
              upstream_repository: $upstream_repository,
              upstream_tag: $upstream_tag,
              upstream_commit: $upstream_commit,
              go_version: $go_version,
              cgo_enabled: false,
              architectures: ["linux/amd64", "linux/arm64"],
              build_tags: ($build_tags | split(",")),
              ldflags: $ldflags
            }' > release-files/BUILD_INFO.json

          cat > release-files/RELEASE_NOTES.md <<EOF_NOTES
          # sing-box ${{ steps.latest.outputs.tag }}

          本版本从 SagerNet/sing-box 官方 tag `${{ steps.latest.outputs.tag }}` 的提交
          `${upstream_commit}` 构建，保留上游 Linux 默认功能（除未随包提供运行库的
          `with_naive_outbound`），并追加 `with_v2ray_api`。

          许可证：GPL-3.0-or-later。对应源码、上游许可证、构建参数和校验和均与二进制一同提供。
          EOF_NOTES

          sha256sum release-files/* > release-files/sha256sum.txt

      - name: 创建 GitHub Release
        if: steps.current.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.latest.outputs.tag }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" release-files/* \
              --repo "${{ github.repository }}" \
              --clobber
            gh release edit "$tag" \
              --repo "${{ github.repository }}" \
              --title "$tag" \
              --notes-file release-files/RELEASE_NOTES.md
          else
            gh release create "$tag" \
              release-files/* \
              --repo "${{ github.repository }}" \
              --title "$tag" \
              --notes-file release-files/RELEASE_NOTES.md
          fi
