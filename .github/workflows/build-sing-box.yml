name: Build sing-box with v2ray api

on:
  workflow_dispatch:
  schedule:
    # 每天 03:20 UTC，配合 should_build 比对，无新版自动跳过
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  check-build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl tar gzip

      - name: Get latest upstream release
        id: latest
        run: |
          latest_tag=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -er '.tag_name // empty')
          printf '%s' "$latest_tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$'
          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "version=${latest_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Get current release in this repo and decide whether to build
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_TAG: ${{ steps.latest.outputs.tag }}
        run: |
          status=$(curl -sS -o release-info.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$UPSTREAM_TAG")
          case "$status" in
            200)
              if jq -e '
                [.assets[].name] as $names |
                ["sing-box-linux-amd64.tar.gz", "sing-box-linux-arm64.tar.gz", "sha256sum.txt", "sing-box-LICENSE", "BUILD_INFO.json", "sing-box-source.tar.gz"] |
                all(. as $name | $names | index($name) != null)
              ' release-info.json >/dev/null; then
                echo "should_build=false" >> "$GITHUB_OUTPUT"
              else
                echo "should_build=true" >> "$GITHUB_OUTPUT"
              fi
              ;;
            404) echo "should_build=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Release lookup failed: HTTP $status" >&2; exit 1 ;;
          esac

      - name: Show skip reason
        if: steps.current.outputs.should_build != 'true'
        run: |
          echo "Skip build because current repo is already at latest upstream release: ${{ steps.latest.outputs.tag }}"

      - name: Checkout sing-box source
        if: steps.current.outputs.should_build == 'true'
        uses: actions/checkout@v5
        with:
          repository: SagerNet/sing-box
          ref: ${{ steps.latest.outputs.tag }}
          path: sing-box-src
          fetch-depth: 0

      - name: Setup Go
        if: steps.current.outputs.should_build == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: sing-box-src/go.mod
          cache: true
          cache-dependency-path: sing-box-src/go.sum

      - name: Prepare build tags and ldflags
        if: steps.current.outputs.should_build == 'true'
        id: meta
        run: |
          cd sing-box-src

          default_tags=$(tr '\n' ',' < release/DEFAULT_BUILD_TAGS | sed 's/,$//')

          # Naive needs libcronet.so, which is not distributed by this workflow.
          final_tags=$(printf '%s\n' "${default_tags},with_v2ray_api,with_acme" | tr ',' '\n' | awk 'NF && $0 != "with_naive_outbound" && !seen[$0]++' | paste -sd',' -)

          # 原项目 ldflags
          base_ldflags=$(tr '\n' ' ' < release/LDFLAGS | sed 's/  */ /g')

          # 显式写入版本号，避免 sing-box version 显示 unknown
          final_ldflags="-X 'github.com/sagernet/sing-box/constant.Version=${{ steps.latest.outputs.version }}' ${base_ldflags}"

          echo "tags=$final_tags" >> "$GITHUB_OUTPUT"
          echo "ldflags=$final_ldflags" >> "$GITHUB_OUTPUT"

          echo "Using tags: $final_tags"
          echo "Using ldflags: $final_ldflags"

      - name: Build linux amd64
        if: steps.current.outputs.should_build == 'true'
        run: |
          cd sing-box-src
          mkdir -p ../dist/linux-amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -trimpath \
            -ldflags "${{ steps.meta.outputs.ldflags }}" \
            -tags "${{ steps.meta.outputs.tags }}" \
            -o ../dist/linux-amd64/sing-box \
            ./cmd/sing-box

      - name: Build linux arm64
        if: steps.current.outputs.should_build == 'true'
        run: |
          cd sing-box-src
          mkdir -p ../dist/linux-arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
          go build -trimpath \
            -ldflags "${{ steps.meta.outputs.ldflags }}" \
            -tags "${{ steps.meta.outputs.tags }}" \
            -o ../dist/linux-arm64/sing-box \
            ./cmd/sing-box

      - name: Verify amd64 build tags
        if: steps.current.outputs.should_build == 'true'
        run: |
          chmod +x dist/linux-amd64/sing-box
          dist/linux-amd64/sing-box version
          dist/linux-amd64/sing-box version | grep "${{ steps.latest.outputs.version }}"
          dist/linux-amd64/sing-box version | grep with_v2ray_api
          dist/linux-amd64/sing-box version | grep with_acme

      - name: Verify all binaries exist
        if: steps.current.outputs.should_build == 'true'
        run: |
          test -f dist/linux-amd64/sing-box
          test -f dist/linux-arm64/sing-box

      - name: Package tar.gz
        if: steps.current.outputs.should_build == 'true'
        run: |
          mkdir -p release-files
          tar -C dist/linux-amd64 -czf release-files/sing-box-linux-amd64.tar.gz sing-box
          tar -C dist/linux-arm64 -czf release-files/sing-box-linux-arm64.tar.gz sing-box

          cp dist/linux-amd64/sing-box release-files/sing-box-linux-amd64
          cp dist/linux-arm64/sing-box release-files/sing-box-linux-arm64

          cp sing-box-src/LICENSE release-files/sing-box-LICENSE
          git -C sing-box-src archive --format=tar.gz --prefix=sing-box-source/ \
            --output=../release-files/sing-box-source.tar.gz HEAD
          jq -n --arg upstream "https://github.com/SagerNet/sing-box" \
            --arg commit "$(git -C sing-box-src rev-parse HEAD)" \
            --arg tag "${{ steps.latest.outputs.tag }}" \
            --arg go "$(go env GOVERSION)" --arg tags "${{ steps.meta.outputs.tags }}" \
            --arg ldflags "${{ steps.meta.outputs.ldflags }}" \
            '{upstream:$upstream,commit:$commit,tag:$tag,go:$go,build_tags:$tags,ldflags:$ldflags,cgo_enabled:false}' \
            > release-files/BUILD_INFO.json
          (cd release-files && sha256sum sing-box-linux-* sing-box-source.tar.gz sing-box-LICENSE BUILD_INFO.json > sha256sum.txt)

      - name: Create release with gh
        if: steps.current.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.latest.outputs.tag }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" release-files/* --clobber --repo "${{ github.repository }}"
            gh release edit "$tag" --latest=false --repo "${{ github.repository }}"
          else
            gh release create "$tag" release-files/* \
              --repo "${{ github.repository }}" \
              --latest=false \
              --title "sing-box $tag" \
              --notes "Built from official sing-box source with V2Ray API. Corresponding source, GPL license, build metadata and checksums included. Naive excluded because libcronet.so is not bundled."
          fi
