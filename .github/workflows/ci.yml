name: Validate subflow

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal configs)"
      - run: go mod download
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Build Linux targets
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/subflow-linux-amd64 ./cmd/subflow
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o dist/subflow-linux-arm64 ./cmd/subflow
      - name: Validate bootstrap
        run: |
          bash -n deploy/install.sh
          shellcheck deploy/install.sh
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  debian:
    name: Debian ${{ matrix.version }} userspace
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['12', '13']
    container: debian:${{ matrix.version }}-slim
    steps:
      - name: Install isolated test environment dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential systemd shellcheck
      - uses: actions/checkout@v5
      - name: Trust the checked-out container workspace
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" status --porcelain
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go test -race -count=1 ./...
      - run: go build -trimpath -o /tmp/subflow ./cmd/subflow
      - name: Verify non-mutating CLI and bootstrap syntax
        run: |
          /tmp/subflow version
          /tmp/subflow help
          bash -n deploy/install.sh
          shellcheck deploy/install.sh
